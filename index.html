<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cancionero</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🎵</text></svg>">
  <!-- Cancionero Pastoral · Versión 1 (22/11/2026): botones ⏪ ⏩ y búsqueda sin tildes
       Archivos: index.html (esta página), estilos.css (aspecto), cancionero.js (funcionamiento),
       bundle.js (librería de acordes ChordSheetJS).
       El "?v=1" de los enlaces es el número de versión de cada archivo: súbelo (?v=1.1, ?v=1.2...)
       cada vez que cambies ese archivo, para que los navegadores no usen la copia vieja. -->
  <script src="bundle.js"></script>
  <link rel="stylesheet" href="estilos.css?v=1">
</head>
<body>
<script>
  // Modo noche: se aplica antes de pintar la página, para que no haya un destello blanco al abrirla de noche
  (function () {
    let dark;
    try { const v = localStorage.getItem('cancionero.dark'); if (v !== null) dark = JSON.parse(v); } catch (e) {}
    if (dark === undefined) dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (dark) document.body.classList.add('dark');
  })();
</script>

<h1 class="main-title">🎵 Cancionero Pastoral
  <button id="dark-toggle" onclick="toggleDark()" title="Modo noche" aria-label="Cambiar modo claro/noche"></button>
<!--  <a id="suggest-btn" href="https://forms.gle/1nq47R5Nv6jpKeZj8" target="_blank" rel="noopener" title="Proponer canción, corrección o sugerencia" aria-label="Proponer canción, corrección o sugerencia">➕</a> -->
</h1>

<input type="text" id="search" placeholder="Buscar por título, código o letra..." oninput="renderList()" />
<div id="theme-filter"></div>
<ul id="song-list"></ul>

<div id="song-viewer">
  <div class="viewer-header">
    <button class="song-nav" id="prev-btn" onclick="goToSong(-1)" title="Canción anterior" aria-label="Canción anterior">⏪</button>
    <h2 id="viewer-title"></h2>
    <button class="song-nav" id="next-btn" onclick="goToSong(1)" title="Canción siguiente" aria-label="Canción siguiente">⏩</button>
  </div>
  <p class="song-meta" id="viewer-meta"></p>
  <div class="transpose-controls">
    <button onclick="transpose(-1)" title="Bajar tono" aria-label="Bajar tono">⬇️</button>
    <button onclick="transpose(1)" title="Subir tono" aria-label="Subir tono">⬆️</button>
    <span class="tone-label" id="tone-label"></span>
    <div class="controls-divider"></div>
    <div class="font-size-controls">
      <button onclick="changeFontSize(-1)">A-</button>
      <button onclick="changeFontSize(1)">A+</button>
    </div>
    <button id="notation-toggle" onclick="toggleNotation()">Do-Re-Mi</button>
    <button id="lyrics-toggle" onclick="toggleLyricsOnly()"><span class="chord-icon">C</span></button>
    <button id="share-btn" onclick="shareSong()" title="Compartir canción" aria-label="Compartir canción">📤</button>
  </div>
  <div id="song"></div>
  <div class="song-nav-bottom">
    <button class="song-nav" id="prev-btn-bottom" onclick="goToSong(-1)"></button>
    <button class="song-nav" id="next-btn-bottom" onclick="goToSong(1)"></button>
  </div>
</div>

<button id="top-btn" onclick="goToTop()" title="Volver a la búsqueda" aria-label="Volver arriba, a la búsqueda">🔍</button>
<div id="toast" role="status"></div>

<script src="cancionero.js?v=1"></script>

</body>
</html>
